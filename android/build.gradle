plugins { id 'com.android.application' }

configurations { natives }

android {
    namespace 'com.arashiaz.backgammonpro3d'
    compileSdk 37
    defaultConfig {
        applicationId 'com.arashiaz.backgammonpro3d'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'

    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86_64'
}

def nativeOutput = file("$projectDir/src/main/jniLibs")

tasks.register('extractGdxNatives', Sync) {
    into(nativeOutput)

    configurations.natives.files.each { nativeJar ->
        def fileName = nativeJar.name
        def abi = fileName.contains('arm64-v8a') ? 'arm64-v8a' :
                  fileName.contains('armeabi-v7a') ? 'armeabi-v7a' :
                  fileName.contains('x86_64') ? 'x86_64' :
                  fileName.contains('x86') ? 'x86' : null

        if (abi != null) {
            from(zipTree(nativeJar)) {
                include 'libgdx.so'
                into(abi)
            }
        }
    }
}

tasks.named('preBuild') {
    dependsOn('extractGdxNatives')
}


def woodTextureAsset = file("$projectDir/src/main/assets/textures/board_wood_texture.jpg")
def woodTextureBase64 = file("$projectDir/src/main/assets/textures/board_wood_texture.jpg.b64")

tasks.register('decodeBoardWoodTexture') {
    outputs.file(woodTextureAsset)
    inputs.file(woodTextureBase64)
    doLast {
        if (!woodTextureAsset.parentFile.exists()) woodTextureAsset.parentFile.mkdirs()
        byte[] bytes = java.util.Base64.decoder.decode(woodTextureBase64.getText('UTF-8').trim())
        woodTextureAsset.bytes = bytes
    }
}

tasks.named('preBuild') {
    dependsOn('decodeBoardWoodTexture')
}
